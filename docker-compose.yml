version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=SuperSecretPass123!
      - POSTGRES_DB=FileShareDb
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FileShareDb;Username=postgres;Password=SuperSecretPass123!
    depends_on:
      - db

  web:
    build:
      context: ./file-share-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api