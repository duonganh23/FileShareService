name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Triggers when code is pushed to master

jobs:
  # 1. MERIT REQUIREMENT: Linting and Testing
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x' # Adjust to match your project's version

      - name: Run .NET Tests
        run: dotnet test ./FileShareService

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Adjust to match your Vue setup

      - name: Install Frontend Dependencies
        working-directory: ./file-share-frontend
        run: npm install

      - name: Run Frontend Linting
        working-directory: ./file-share-frontend
        run: npm run lint --if-present

  # 2. PASS REQUIREMENT: Build and Push Docker Images
  build-and-push:
    needs: lint-and-test # This ensures Docker images only build if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .          # Root directory context for the backend Dockerfile[cite: 3]
          file: ./Dockerfile  # Points explicitly to the root Dockerfile[cite: 3]
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fileshare-api:latest 

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./file-share-frontend
          file: ./file-share-frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/fileshare-web:latest

  # 3. PASS REQUIREMENT: Automated Deployment
# 3. PASS REQUIREMENT: Automated Deployment
deploy:
  needs: build-and-push 
  runs-on: ubuntu-latest
  steps:
    - name: Trigger Backend Render Deployment
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

    - name: Trigger Frontend Render Deployment
      run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
