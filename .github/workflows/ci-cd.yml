name: CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Triggers when code is pushed to master

jobs:
  # 1. MERIT REQUIREMENT: Linting and Testing
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x' # Adjust to match your project's version

      - name: Run .NET Tests
        run: dotnet test ./FileShareService

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Adjust to match your Vue setup

      - name: Install Frontend Dependencies
        working-directory: ./file-share-frontend
        run: npm install

      - name: Run Frontend Linting
        working-directory: ./file-share-frontend
        run: npm run lint --if-present

  # 2. PASS REQUIREMENT: Build and Push Docker Images
  build-and-push:
    needs: lint-and-test # This ensures Docker images only build if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./FileShareService
          push: true
          # Dynamically uses your Docker username secret
          tags: ${{ secrets.DOCKER_USERNAME }}/fileshare-api:latest 

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./file-share-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fileshare-web:latest

  # 3. PASS REQUIREMENT: Automated Deployment
  deploy:
    needs: build-and-push # Ensures we only deploy if the new images were pushed successfully
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        # Sends a web request to Render to pull the latest image and deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
